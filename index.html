<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RunBoard · Street running events</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__inner">
        <a class="logo" href="/"><img src="/favicon.svg" alt="" width="32" height="32" /><span>Run<b>Board</b></span></a>
        <nav id="account" class="topbar__actions"></nav>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <p class="eyebrow">Street running events</p>
        <h1>Every race in one place.<br /><span>Every kit pickup on time.</span></h1>
        <p class="hero__subtitle">Find 5K, 10K and half marathons near you, with the details that usually get lost in group chats.</p>

        <form id="search" class="search">
          <label class="field">
            City
            <input name="city" type="search" placeholder="Porto Alegre, São Leopoldo…" />
          </label>
          <div class="field">
            Distance
            <div class="chips">
              <label class="chip"><input type="radio" name="distance" value="" checked />All</label>
              <label class="chip"><input type="radio" name="distance" value="3" />3K</label>
              <label class="chip"><input type="radio" name="distance" value="5" />5K</label>
              <label class="chip"><input type="radio" name="distance" value="10" />10K</label>
              <label class="chip"><input type="radio" name="distance" value="21" />21K</label>
              <label class="chip"><input type="radio" name="distance" value="42" />42K</label>
            </div>
          </div>
          <button class="btn">Search</button>
        </form>
      </div>
    </section>

    <main class="container">
      <div class="feed-header">
        <h2>Upcoming races</h2>
        <p id="feed-count" class="muted"></p>
      </div>
      <div id="feed" class="grid"></div>
    </main>


    <dialog id="login-dialog">
      <button class="icon-btn close" type="button" data-close aria-label="Close">✕</button>
      <form id="login-form" class="stack">
        <h2>Organizer access</h2>
        <p class="muted">Organizers sign in to publish and manage their races.</p>
        <label class="field">E-mail <input name="email" type="email" required /></label>
        <label class="field">Password <input name="password" type="password" minlength="6" placeholder="At least 6 characters" required /></label>
        <p class="error" id="login-error"></p>
        <button class="btn" value="signin">Sign in</button>
        <button class="btn btn--ghost" value="signup">Create account</button>
      </form>
    </dialog>

    <dialog id="event-dialog" class="dialog--wide">
      <button class="icon-btn close" type="button" data-close aria-label="Close">✕</button>
      <form id="event-form" class="stack">
        <h2 id="event-title">Publish a race</h2>
        <label class="dropzone">
          <input name="banner" type="file" accept="image/*" hidden />
          <img id="banner-preview" alt="" hidden />
          <span id="banner-hint">Click to choose the race banner<br /><small>JPG or PNG</small></span>
        </label>
        <div class="form-grid">
          <label class="field field--full">Race name * <input name="name" required /></label>
          <label class="field">Start date and time * <input name="start_at" type="datetime-local" required /></label>
          <label class="field">City * <input name="city" required /></label>
          <label class="field">Start location <input name="location" /></label>
          <label class="field">Distances (km) <input name="distances" placeholder="5, 10, 21" /></label>
          <label class="field field--full">Kit pickup <input name="kit_pickup_info" placeholder="Day, time and place" /></label>
          <label class="field">Entry fee (R$) <input name="entry_fee" type="number" step="0.01" min="0" /></label>
          <label class="field">Official website <input name="official_url" type="url" placeholder="https://" /></label>
        </div>
        <p class="error" id="event-error"></p>
        <div class="actions">
          <button class="btn btn--ghost" type="button" data-close>Cancel</button>
          <button class="btn" id="event-submit">Publish race</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
